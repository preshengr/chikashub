# Chika's Game Hub — backend on Firebase App Hosting (reads this file from the repo root).
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# Plain NestJS app — no framework adapter — so build/run are explicit.
# Do NOT set NODE_ENV for BUILD availability: npm must install devDependencies (typescript).
scripts:
  buildCommand: npm run build -w backend
  runCommand: npm run start:api

# Keep every build artifact: node_modules must ship (NestJS is required at runtime,
# tsc only transpiles).
outputFiles:
  serverApp:
    include: [.]
env:
  - variable: NODE_ENV
    value: production
    availability:
      - RUNTIME
  - variable: DATA_STORE
    value: firestore
    availability:
      - RUNTIME
  - variable: TRUST_PROXY
    value: "true"
    availability:
      - RUNTIME
