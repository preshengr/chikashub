<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A glowing neon playground under a starry night sky">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0518"/>
      <stop offset="45%" stop-color="#1a0b45"/>
      <stop offset="78%" stop-color="#3a1568"/>
      <stop offset="100%" stop-color="#5a1f6e"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7c9"/>
      <stop offset="70%" stop-color="#ffe93c"/>
      <stop offset="100%" stop-color="#ffcc2e"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe93c" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffe93c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cff"/>
      <stop offset="100%" stop-color="#4a1f9e"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff2fd6"/>
      <stop offset="100%" stop-color="#6e1274"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22e6ff"/>
      <stop offset="100%" stop-color="#0d5f8f"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="neonPink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <g fill="#ffffff">
    <circle cx="120" cy="90" r="2.4" opacity="0.9"/>
    <circle cx="260" cy="160" r="1.8" opacity="0.7"/>
    <circle cx="420" cy="70" r="2.2" opacity="0.85"/>
    <circle cx="560" cy="200" r="1.6" opacity="0.6"/>
    <circle cx="700" cy="110" r="2.6" opacity="0.9"/>
    <circle cx="880" cy="60" r="1.7" opacity="0.7"/>
    <circle cx="1010" cy="180" r="2.1" opacity="0.8"/>
    <circle cx="1180" cy="90" r="2.5" opacity="0.9"/>
    <circle cx="1330" cy="210" r="1.6" opacity="0.65"/>
    <circle cx="1470" cy="120" r="2.3" opacity="0.85"/>
    <circle cx="1540" cy="300" r="1.7" opacity="0.6"/>
    <circle cx="90" cy="300" r="1.9" opacity="0.7"/>
    <circle cx="330" cy="330" r="1.5" opacity="0.55"/>
    <circle cx="640" cy="300" r="2" opacity="0.75"/>
    <circle cx="960" cy="330" r="1.5" opacity="0.55"/>
    <circle cx="1250" cy="360" r="1.8" opacity="0.7"/>
  </g>

  <g stroke="#ffe93c" stroke-width="3" stroke-linecap="round" opacity="0.95" filter="url(#neonPink)">
    <path d="M180 240 l0 -26 M180 240 l0 26 M180 240 l-26 0 M180 240 l26 0 M180 240 l-18 -18 M180 240 l18 18 M180 240 l18 -18 M180 240 l-18 18"/>
  </g>
  <g stroke="#22e6ff" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
    <path d="M1420 170 l0 -20 M1420 170 l0 20 M1420 170 l-20 0 M1420 170 l20 0 M1420 170 l-14 -14 M1420 170 l14 14 M1420 170 l14 -14 M1420 170 l-14 14"/>
  </g>
  <g stroke="#ff2fd6" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
    <path d="M1080 420 l0 -18 M1080 420 l0 18 M1080 420 l-18 0 M1080 420 l18 0 M1080 420 l-13 -13 M1080 420 l13 13 M1080 420 l13 -13 M1080 420 l-13 13"/>
  </g>

  <circle cx="1320" cy="150" r="150" fill="url(#moonGlow)"/>
  <circle cx="1320" cy="150" r="78" fill="url(#moon)"/>
  <circle cx="1300" cy="135" r="12" fill="#f0d264" opacity="0.6"/>
  <circle cx="1345" cy="175" r="9" fill="#f0d264" opacity="0.5"/>
  <circle cx="1335" cy="120" r="6" fill="#f0d264" opacity="0.5"/>

  <path d="M0 620 C 220 540 380 660 560 600 C 760 534 900 660 1120 596 C 1320 538 1440 640 1600 596 L1600 900 L0 900 Z" fill="url(#hillFar)" opacity="0.85"/>
  <path d="M0 720 C 260 640 420 770 660 710 C 900 650 1060 780 1300 716 C 1440 680 1520 730 1600 710 L1600 900 L0 900 Z" fill="url(#hillNear)" opacity="0.92"/>

  <g opacity="0.95">
    <rect x="700" y="470" width="180" height="240" rx="12" fill="#12093a" stroke="url(#tower)" stroke-width="6"/>
    <polygon points="700,470 790,380 880,470" fill="#12093a" stroke="#ff2fd6" stroke-width="6"/>
    <circle cx="790" cy="352" r="16" fill="#ffe93c" filter="url(#soft)"/>
    <rect x="730" y="520" width="46" height="56" rx="8" fill="#22e6ff" opacity="0.85"/>
    <rect x="804" y="520" width="46" height="56" rx="8" fill="#ff2fd6" opacity="0.85"/>
    <rect x="762" y="618" width="56" height="92" rx="10" fill="#8b5cff" opacity="0.9"/>
    <g stroke="#39ff88" stroke-width="5" filter="url(#neonPink)">
      <path d="M726 690 h40"/>
      <path d="M814 690 h40"/>
    </g>
  </g>

  <g>
    <rect x="380" y="600" width="120" height="120" rx="14" fill="#150a35" stroke="#ffe93c" stroke-width="5"/>
    <path d="M360 600 L440 520 L520 600 Z" fill="#150a35" stroke="#ff2fd6" stroke-width="5"/>
    <rect x="416" y="650" width="48" height="70" rx="8" fill="#39ff88" opacity="0.85"/>
  </g>
  <g>
    <rect x="1060" y="580" width="140" height="150" rx="14" fill="#150a35" stroke="#22e6ff" stroke-width="5"/>
    <path d="M1040 580 L1130 500 L1220 580 Z" fill="#150a35" stroke="#ffe93c" stroke-width="5"/>
    <rect x="1096" y="630" width="68" height="52" rx="8" fill="#ff2fd6" opacity="0.85"/>
    <rect x="1112" y="700" width="36" height="30" rx="6" fill="#8b5cff" opacity="0.9"/>
  </g>

  <g stroke="#39ff88" stroke-width="7" stroke-linecap="round" opacity="0.9" filter="url(#neonPink)">
    <path d="M180 760 q60 -70 120 0"/>
    <path d="M180 760 q60 60 120 0" opacity="0.5"/>
  </g>
  <g stroke="#ffe93c" stroke-width="7" stroke-linecap="round" opacity="0.9">
    <path d="M1330 740 q60 -70 120 0"/>
    <path d="M1330 740 q60 60 120 0" opacity="0.5"/>
  </g>

  <g opacity="0.9">
    <ellipse cx="640" cy="840" rx="240" ry="46" fill="#0a0518" opacity="0.5"/>
    <rect x="560" y="770" width="170" height="70" rx="34" fill="#1f1150" stroke="#8b5cff" stroke-width="5"/>
    <rect x="585" y="795" width="46" height="26" rx="8" fill="#22e6ff"/>
    <circle cx="680" cy="808" r="14" fill="#ff2fd6"/>
    <circle cx="716" cy="808" r="14" fill="#ffe93c"/>
  </g>
</svg>
